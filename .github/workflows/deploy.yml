name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting, race rules and production build
        run: npm run format:check && npm run check
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Verify complete races, mobile controls and real WebRTC
        run: npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            artifacts/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test-webkit:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and build
        run: npm ci && npm run build
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Verify native WebKit rendering, complete races and touch controls
        run: npm run test:e2e -- tests/game.spec.ts
        env:
          PLAYWRIGHT_BROWSER: webkit
      - name: Preserve WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-evidence
          path: |
            test-results/
            artifacts/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-and-build, test-webkit]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
